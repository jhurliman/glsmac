name: GLSMAC regression tests

on:
  push:
    branches: [main, stable]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
  workflow_dispatch:

# A new PR revision supersedes its prior checks; integration/manual runs finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    uses: ./.github/workflows/ci-scope.yml

  unix:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.unix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache ninja-build libfreetype-dev libsdl2-dev libsdl2-image-dev libglu-dev libglew-dev libossp-uuid-dev libyaml-cpp-dev libavformat-dev libavcodec-dev libavutil-dev libswscale-dev
      - name: Restore Linux compiler outputs
        if: runner.os == 'Linux'
        id: linux-compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: linux-debug-ccache-${{ github.sha }}
          restore-keys: linux-debug-ccache-
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ninja pkg-config sdl2 sdl2_image ossp-uuid glew yaml-cpp freetype ffmpeg
          echo "PKG_CONFIG_PATH=$(brew --prefix ossp-uuid)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - name: Configure
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            ccache --set-config=max_size=2G
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          else
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          fi
      - name: Build
        run: cmake --build build --parallel 3
      # Preserve a successful compile even when the following tests fail.
      # A fixture-only correction can then reuse the just-built production TUs.
      - name: Save Linux compiler outputs
        if: runner.os == 'Linux' && steps.linux-compiler-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ${{ steps.linux-compiler-cache.outputs.cache-primary-key }}
      - name: Test without game assets or a display
        run: ctest --test-dir build --output-on-failure
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ matrix.os }}
          path: build/Testing/Temporary/

  windows:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          # PR checkout is GitHub's merge commit; its first parent is the base.
          fetch-depth: 2
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install movie decoder
        run: ./tools/install_ffmpeg_windows.ps1
      - name: Test compile-priority selection
        run: python tools/test_prioritize_changed_cpp.py
      - name: Configure
        run: cmake --preset x64-debug-win-clang -G Ninja '-DBUILD_TESTING=ON' '-DCMAKE_POLICY_VERSION_MINIMUM=3.5'
      - name: Compile changed C++ objects first
        if: github.event_name == 'pull_request'
        run: python tools/prioritize_changed_cpp.py --build-dir out/build/x64-debug-win-clang --base 'HEAD^1' --jobs 3
      - name: Build
        run: cmake --build out/build/x64-debug-win-clang --parallel 3
      - name: Test without game assets or a display
        run: ctest --test-dir out/build/x64-debug-win-clang --output-on-failure
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-windows-2022
          path: out/build/x64-debug-win-clang/Testing/Temporary/

  gate:
    name: Regression gate
    if: always()
    needs: [scope, unix, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Require every selected regression job to succeed
        env:
          RUN: ${{ needs.scope.outputs.run }}
          FULL: ${{ needs.scope.outputs.full }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          UNIX_RESULT: ${{ needs.unix.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          python3 - <<'PY'
          import os
          from tools.ci_scope import validate_results
          validate_results(*(os.environ[name] for name in ("RUN", "FULL", "SCOPE_RESULT", "UNIX_RESULT", "WINDOWS_RESULT")))
          if os.environ["RUN"] == "false":
              coverage = "Documentation-only or empty change; engine regression not requested"
          else:
              coverage = "Linux, macOS and Windows regression passed" if os.environ["FULL"] == "true" else "Linux regression passed; platform suites not requested for this change"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(coverage + ".\n")
          PY
