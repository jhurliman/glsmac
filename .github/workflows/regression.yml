name: GLSMAC regression tests

on:
  push:
    branches: [main, stable]
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

# A new PR revision supersedes its prior checks; integration/manual runs finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libfreetype-dev libsdl2-dev libsdl2-image-dev libglu-dev libglew-dev libossp-uuid-dev libyaml-cpp-dev
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ninja pkg-config sdl2 sdl2_image ossp-uuid glew yaml-cpp freetype
          echo "PKG_CONFIG_PATH=$(brew --prefix ossp-uuid)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel 3
      - name: Test without game assets or a display
        run: ctest --test-dir build --output-on-failure
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ matrix.os }}
          path: build/Testing/Temporary/

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake --preset x64-debug-win-clang -G Ninja '-DBUILD_TESTING=ON' '-DCMAKE_POLICY_VERSION_MINIMUM=3.5'
      - name: Build
        run: cmake --build out/build/x64-debug-win-clang --parallel 3
      - name: Test without game assets or a display
        run: ctest --test-dir out/build/x64-debug-win-clang --output-on-failure
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-windows-2022
          path: out/build/x64-debug-win-clang/Testing/Temporary/
