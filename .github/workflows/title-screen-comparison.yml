name: Title screen comparison tests

on:
  pull_request:
    paths:
      - tools/reference/compare_title_screen.py
      - tools/tests/test_compare_title_screen.py
      - .github/workflows/title-screen-comparison.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: title-screen-comparison-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install Pillow
      - name: Check exact-match acceptance with synthetic images only
        run: python -B -m unittest discover -s tools/tests -p test_compare_title_screen.py -v
